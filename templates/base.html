{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Agenda de Servicos{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/estilo.css' %}?v=2" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-salon mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">
      <svg class="brand-mark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="6" cy="6" r="2.6"></circle>
        <circle cx="6" cy="18" r="2.6"></circle>
        <path d="M20 6 8.5 12 20 18"></path>
        <path d="M8.5 12 4 12"></path>
      </svg>
      Agenda de Servicos
    </a>
    <div class="navbar-nav">
      <a class="nav-link" href="{% url 'cliente_lista' %}">Clientes</a>
      <a class="nav-link" href="{% url 'servico_lista' %}">Servicos</a>
      <a class="nav-link" href="{% url 'agendamento_lista' %}">Agendamentos</a>
      <a class="nav-link" href="{% url 'relatorios' %}">Relatorios</a>
      <a class="nav-link" href="{% url 'admin:index' %}">Admin</a>
    </div>
  </div>
</nav>

<div class="container pb-5">
  {% for mensagem in messages %}
    <div class="alert alert-{{ mensagem.tags }} alert-dismissible fade show">
      {{ mensagem }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}

  {% block conteudo %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
